<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon mini site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bienvenue sur mon mini site</h1>
        <p>Ce site a été créé pour un TP sur Git et GitHub.</p>
        <button id="btn">Clique ici</button>
        <p id="message"></p>
    </div>

    <script>
        document.getElementById('btn').addEventListener('click', function() {
            document.getElementById('message').innerHTML = 'Bravo !  Tu as cliqué.';
        });
    </script>
</body>
</html>
